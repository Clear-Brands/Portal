name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    name: Migrations install on an empty database
    runs-on: ubuntu-latest

    # The check the original schema.sql could never pass: it added columns to
    # tables forty lines before creating them, so it only ever worked against a
    # database that had already been through earlier versions.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations, seed, and assert row-level security
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
        run: ./scripts/verify-migrations.sh cb_ci
