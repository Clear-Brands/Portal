# Local Supabase stack. `supabase start` reads this.
project_id = "clearbrands-portal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# PostgREST's default cap. The app never relies on it — every list paginates
# explicitly and every total is a SQL sum — but a low ceiling makes an accidental
# "select everything" fail loudly in development instead of silently truncating
# the way the original did at 1,000 rows.
max_rows = 200

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Catches every outbound email locally so sign-in links never leave the machine.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false          # Accounts are created by invitation only.

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
